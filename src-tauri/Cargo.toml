[package]
name = "hyperclicker"
version = "0.1.1"
description = "High-precision OS-level click engine"
authors = ["HyperClicker"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sync` makes Rhai's Engine Send + Sync, which the engine thread and the
# telemetry thread both require.
rhai = { version = "1.26", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Build scripts and proc macros (Rhai's derive macros, serde's, tauri-build's)
# are host artifacts that never ship. Optimising, LTO-linking and stripping
# them only slows every clean release build down -- and on a machine with
# application control enabled, stripping them was enough for the generated
# proc-macro DLL to be refused at load time, which rustc reports as
# `can't find crate for ...`.
[profile.release.build-override]
opt-level = 0
codegen-units = 256
debug = false
debug-assertions = false
strip = "none"
incremental = false
